# WindLoad.co Campaign Pages Auto-Deploy
# Deploys 1 page from staged-pages every 1.5 hours (14 pages/day)
# This trains Google crawlers to check for fresh content frequently

name: Daily Campaign Deploy

on:
  # TEMPORARILY DISABLED - Uncomment when staged pages are ready
  # schedule:
  #   # Run 14 times per day, every ~1.5 hours (6 AM - 1:30 AM UTC)
  #   - cron: '0 6 * * *'    # 6:00 AM UTC
  #   - cron: '30 7 * * *'   # 7:30 AM UTC
  #   - cron: '0 9 * * *'    # 9:00 AM UTC
  #   - cron: '30 10 * * *'  # 10:30 AM UTC
  #   - cron: '0 12 * * *'   # 12:00 PM UTC
  #   - cron: '30 13 * * *'  # 1:30 PM UTC
  #   - cron: '0 15 * * *'   # 3:00 PM UTC
  #   - cron: '30 16 * * *'  # 4:30 PM UTC
  #   - cron: '0 18 * * *'   # 6:00 PM UTC
  #   - cron: '30 19 * * *'  # 7:30 PM UTC
  #   - cron: '0 21 * * *'   # 9:00 PM UTC
  #   - cron: '30 22 * * *'  # 10:30 PM UTC
  #   - cron: '0 0 * * *'    # 12:00 AM UTC
  #   - cron: '30 1 * * *'   # 1:30 AM UTC

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      page_count:
        description: 'Number of pages to deploy (default: 1)'
        required: false
        default: '1'
      dry_run:
        description: 'Dry run (no actual deployment)'
        required: false
        default: 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git
        run: |
          git config --global user.name "WindLoad Deploy Bot"
          git config --global user.email "deploy@windload.co"

      - name: Run deployment script
        id: deploy
        run: |
          PAGE_COUNT=${{ github.event.inputs.page_count || '1' }}
          DRY_RUN=${{ github.event.inputs.dry_run || 'false' }}

          if [ "$DRY_RUN" = "true" ]; then
            node scripts/deploy-daily-pages.js --count $PAGE_COUNT --dry-run
          else
            node scripts/deploy-daily-pages.js --count $PAGE_COUNT
          fi

      - name: Push changes
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Trigger hosting deploy (if using Vercel/Netlify)
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          # Uncomment and configure if using Vercel deploy hook
          # curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" \
          #   --retry 3 \
          #   --retry-delay 5 \
          #   -H "Content-Type: application/json"

          # For GitHub Pages, the push above triggers deployment automatically
          echo "Deployment triggered successfully"

      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Pages deployed: ${{ steps.deploy.outputs.deployed || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date -u)" >> $GITHUB_STEP_SUMMARY
